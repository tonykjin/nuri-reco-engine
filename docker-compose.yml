# docker compose up --build  ->  engine on http://localhost:8000, web on http://localhost:3000
services:
  engine:
    build: ./engine
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        # The browser calls the engine, so this is the engine's address as seen from the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      engine:
        condition: service_healthy
