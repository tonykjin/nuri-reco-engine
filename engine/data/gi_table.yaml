# Hand-curated glycemic index table (glucose = 100) for build_foods.py. Spec §7.1: GI/GL from a curated
# table; GI varies with ripeness and preparation. Values were entered from the International Tables of
# Glycemic Index (Atkinson et al.) and have NOT yet been checked line by line against the papers, so
# every row is verify: true (agreed 2026-10-19). GL is computed per 100 g as GI x available carbs / 100.
sources:
  ATKINSON2008: "Atkinson FS, Foster-Powell K, Brand-Miller JC. International tables of glycemic index and glycemic load values: 2008. Diabetes Care 2008;31(12):2281-2283 (supplementary tables)."
