# Curated food list for build_foods.py (runbook Task 12). Each food points at a USDA FoodData Central
# record: Foundation (preferred), SR Legacy, or a Branded product fetched from the FDC API where the
# spec 7.3 food isn't in either (energy gel, sport chews, skyr). `nova` is hand-tagged (1 unprocessed
# ... 4 ultra-processed). `contains` adds allergens a name can't reveal (composite foods); other
# allergens come from keyword rules in allergens.yaml. `gluten_free: false` overrides the rules.
# `fallback_fdc_id` (Foundation foods): an SR Legacy record for the same food; any nutrient the
# Foundation record doesn't report is taken from it (foods.json lists which in nutrient_sources).
datasets:
  foundation: FoodData_Central_foundation_food_csv_2026-04-30
  sr_legacy: FoodData_Central_sr_legacy_food_csv_2018-04

