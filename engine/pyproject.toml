[project]
name = "nuri-reco"
version = "0.1.0"
description = "Nuri recommendation engine: goal matrices, safety, targets and food scoring"
readme = "README.md"
authors = [
    { name = "Tony Jin", email = "tonyjin23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "hypothesis>=6.170.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
