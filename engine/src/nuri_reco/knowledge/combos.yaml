# Matrix B: Goal-combination resolver. Source: spec §4.1 (priority hierarchy, resolver rules)
# and §4.2 (common combinations). Phases and the deadline check (§4.3, §4.4) are in phases.yaml.
# `text` is the page wording verbatim (markdown emphasis removed). Combination rows on the page
# name no sources, so their citation_ids are empty.
spec_section: "4"

tiers:
  - id: TIER.SAFETY
    tier: 1
    domain: "Safety & medical"
    text: "1 | Safety & medical | Pregnancy, under 18, CKD, glucose-lowering meds, ED flags, low energy availability override everything (Matrix F)"
    guardrail_rule_ids:
      [
        GUARD.UNDER_18,
        GUARD.PREGNANCY,
        GUARD.CKD,
        GUARD.SGLT2,
        GUARD.INSULIN_SU,
        GUARD.ED_RISK,
        GUARD.LOW_EA,
      ]
    citation_ids: []
    verify: false
    heuristic: false
  - id: TIER.EVENT_WINDOW
    tier: 2
    domain: "Performance event window"
    text: "2 | Performance event window | From ≈6 weeks before the event through race week, performance fueling wins and body-comp deficits stop"
    # Goal types each tier owns (resolver lookup, not on the page).
    goal_types: [endurance_event]
    weeks_before_event: 6
    citation_ids: []
    verify: false
    heuristic: false
  - id: TIER.DEADLINE
    tier: 3
    domain: "Deadline aesthetic goal"
    text: "3 | Deadline aesthetic goal | Pursued only at a safe rate; clamped, never accelerated"
    goal_types: [deadline_event]
    citation_ids: []
    verify: false
    heuristic: false
  - id: TIER.BODY_COMP
    tier: 4
    domain: "Body composition"
    text: "4 | Body composition | Cut / recomp / bulk; one direction per phase"
    goal_types: [lose_fat, recomp, build_muscle, gain_weight, strength_hybrid]
    citation_ids: []
    verify: false
    heuristic: false
  - id: TIER.GENERAL_HEALTH
    tier: 5
    domain: "General health"
    text: "5 | General health | Fiber, micronutrients, diet quality. Always on, never traded away"
    goal_types: [maintain]
    always_on: true
    citation_ids: []
    verify: false
    heuristic: false

tier_rule:
  id: TIER.RULE
  text: "When goals conflict, the higher tier wins the energy direction. Lower tiers become modifiers (protein, carb timing, food priorities) or get sequenced into a later phase."
  # Condition goals never hold the energy direction; they add RD gating and modifiers. Alone,
  # they run at maintenance (Matrix A: "Maintenance or individualized", "Per weight goal").
  modifier_only_goal_types: [t2d, glp1, hypertension]
  default_energy: maintenance
  citation_ids: []
  verify: false
  heuristic: false

resolver_rules:
  - id: RESOLVER.ONE_ENERGY_GOAL
    order: 1
    text: "One primary energy goal per phase (deficit, maintenance or surplus). Protein stays high across all phases."
    copy:
      deficit: "A steady calorie deficit, with protein kept high to protect muscle."
      maintenance: "Eating at maintenance, with protein kept high."
      surplus: "A small calorie surplus to support building muscle."
    citation_ids: []
    verify: false
    heuristic: false
  - id: RESOLVER.CONTRADICTION
    order: 2
    text: 'Contradictory energy directions in the same phase (e.g. "gain weight" + "lose fat") → check recomp eligibility. If eligible, use recomp. If not, ask the user to order them and sequence them as phases.'
    copy:
      question: "These goals pull in opposite directions. Which matters most first?"
      sequenced: "You chose to work on this goal first; the next one follows once it's done."
    citation_ids: []
    verify: false
    heuristic: false
  - id: RESOLVER.TIMELINE
    order: 3
    text: "Time-bound goals create a timeline; the resolver emits phases with start/end dates (= PRD Seasons)."
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: false
  - id: RESOLVER.RAMP
    order: 4
    text: "Target changes between phases ramp over 7–14 days rather than jump (PRD §5.8) 🧪 Loam heuristic."
    ramp_days: { min: 7, max: 14 }
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: true
  - id: RESOLVER.CARE_HOLD
    order: 5
    text: "On the Care tier, a direction flip or a condition goal holds for RD confirmation (PRD §5.8 magnitude gating)."
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: false

combinations:
  - id: COMBO.LOSEFAT_MUSCLE
    goals: [lose_fat, build_muscle]
    name: "Lose fat + build muscle"
    resolved_energy: "Recomp (0–20% deficit) if novice, overweight, or returning lifter"
    resolves_to: recomp
    deficit_pct_tdee: { min: 0, max: 20 }
    modifiers: "Protein 1.6–2.2 g/kg (2.3–3.1 g/kg FFM if lean); resistance training required"
    protein_g_per_kg: { min: 1.6, max: 2.2 }
    lean_protein_g_per_kg_ffm: { min: 2.3, max: 3.1 }
    requires_resistance_training: true
    sequencing: "If trained and lean (≈ men under 15% BF, women under 25% ⚠️ verify, practitioner convention) or stalled 6–8 weeks → recommend cut then lean bulk"
    why: '"You can build muscle while losing fat right now. Keep protein high and the deficit small."'
    text: 'Lose fat + build muscle | Recomp (0–20% deficit) if novice, overweight, or returning lifter | Protein 1.6–2.2 g/kg (2.3–3.1 g/kg FFM if lean); resistance training required | If trained and lean (≈ men under 15% BF, women under 25% ⚠️ verify, practitioner convention) or stalled 6–8 weeks → recommend cut then lean bulk | "You can build muscle while losing fat right now. Keep protein high and the deficit small."'
    citation_ids: []
    verify: true
    heuristic: false
    rules:
      - id: COMBO.LOSEFAT_MUSCLE.LEAN_CUTOFF
        text: "If trained and lean (≈ men under 15% BF, women under 25% ⚠️ verify, practitioner convention) or stalled 6–8 weeks → recommend cut then lean bulk"
        lean_body_fat_pct_below: { male: 15, female: 25 }
        stalled_weeks: { min: 6, max: 8 }
        then: [cut, lean_bulk]
        copy:
          cut: "You're already trained and lean, so losing fat first and then building muscle works better than doing both at once."
          lean_bulk: "With the cut done, a small surplus supports building muscle."
        citation_ids: []
        verify: true
        heuristic: false

  - id: COMBO.LOSEFAT_ENDURANCE
    goals: [lose_fat, endurance_event]
    name: "Lose fat + marathon"
    resolved_energy: "Deficit only in base phase, ≤0.5% BW/week, taken on rest/easy days"
    deficit_phases: [base]
    max_loss_pct_bw_per_week: 0.5
    deficit_day_types: [rest, easy]
    modifiers: "Quality and long days fully fueled (no deficit that day or the evening before); EA ≥30 kcal/kg FFM"
    fully_fueled_day_types: [quality, long]
    ea_min_kcal_per_kg_ffm: 30
    sequencing: "Base: lose fat → Build: maintenance (small rest-day deficit at most) → Peak/Taper/Race: maintenance+ → Recovery 1–2 weeks → resume"
    recovery_weeks: { min: 1, max: 2 }
    why: '"We''ll lose fat in your base block and switch to full fueling 6 weeks out so race day isn''t compromised."'
    text: 'Lose fat + marathon | Deficit only in base phase, ≤0.5% BW/week, taken on rest/easy days | Quality and long days fully fueled (no deficit that day or the evening before); EA ≥30 kcal/kg FFM | Base: lose fat → Build: maintenance (small rest-day deficit at most) → Peak/Taper/Race: maintenance+ → Recovery 1–2 weeks → resume | "We''ll lose fat in your base block and switch to full fueling 6 weeks out so race day isn''t compromised."'
    citation_ids: []
    verify: false
    heuristic: false

  - id: COMBO.LOSEFAT_DEADLINE
    goals: [lose_fat, deadline_event]
    name: "Lose fat + wedding in N weeks"
    resolved_energy: "Deficit at the clamped rate"
    modifiers: "Protein at the top of range; no diet breaks if under 12 weeks"
    no_diet_breaks_under_weeks: 12
    sequencing: "Feasibility check (§4.4); after the event, step back to maintenance over 2–4 weeks 🧪"
    why: '"At a safe pace you''ll reach ≈X kg by the wedding; your full goal is realistic by ‹date›."'
    text: 'Lose fat + wedding in N weeks | Deficit at the clamped rate | Protein at the top of range; no diet breaks if under 12 weeks | Feasibility check (§4.4); after the event, step back to maintenance over 2–4 weeks 🧪 | "At a safe pace you''ll reach ≈X kg by the wedding; your full goal is realistic by ‹date›."'
    feasibility_rule_ids: [FEAS.DEADLINE]
    citation_ids: []
    verify: false
    heuristic: true
    rules:
      - id: COMBO.LOSEFAT_DEADLINE.STEP_BACK
        text: "after the event, step back to maintenance over 2–4 weeks 🧪"
        step_back_weeks: { min: 2, max: 4 }
        copy:
          why: "After the event, calories step back up to maintenance gradually."
        citation_ids: []
        verify: false
        heuristic: true

  - id: COMBO.MUSCLE_ENDURANCE
    goals: [build_muscle, endurance_event]
    name: "Build muscle + endurance (hybrid)"
    resolved_energy: "Maintenance to small surplus"
    modifiers: "20–40 g protein after every session; carbs per day type; refuel between double sessions"
    post_session_protein_g: { min: 20, max: 40 }
    sequencing: "If an endurance event is set, the event window (Tier 2) takes over"
    why: '"Two kinds of training need more fuel than either alone. Muscle gain will be slower, and that''s expected."'
    text: 'Build muscle + endurance (hybrid) | Maintenance to small surplus | 20–40 g protein after every session; carbs per day type; refuel between double sessions | If an endurance event is set, the event window (Tier 2) takes over | "Two kinds of training need more fuel than either alone. Muscle gain will be slower, and that''s expected."'
    citation_ids: []
    verify: false
    heuristic: false

  - id: COMBO.MUSCLE_VEGAN
    goals: [build_muscle]
    diet: vegan
    name: "Build muscle + vegan"
    resolved_energy: "Per build muscle"
    modifiers: "Aim at the upper protein range 🧪; blend sources for leucine (soy, seitan, legumes + grains); B12 mandatory; watch iron, zinc, iodine, calcium, omega-3"
    sequencing: "n/a"
    why: '"Plant proteins carry less leucine per gram, so we pair sources and go a bit higher."'
    text: 'Build muscle + vegan | Per build muscle | Aim at the upper protein range 🧪; blend sources for leucine (soy, seitan, legumes + grains); B12 mandatory; watch iron, zinc, iodine, calcium, omega-3 | n/a | "Plant proteins carry less leucine per gram, so we pair sources and go a bit higher."'
    citation_ids: []
    verify: false
    heuristic: true
    rules:
      - id: COMBO.MUSCLE_VEGAN.UPPER_PROTEIN
        text: "Aim at the upper protein range 🧪"
        position_in_range: upper
        citation_ids: []
        verify: false
        heuristic: true
      - id: COMBO.MUSCLE_VEGAN.NUTRIENTS
        # Shown as a plan warning when this combination applies (engine.py).
        copy:
          warning: "Vegan diets need a reliable source of vitamin B12, such as a supplement or fortified foods."
          why: "Plant foods don't provide B12, and plant proteins carry less leucine, so we pair sources."
        text: "blend sources for leucine (soy, seitan, legumes + grains); B12 mandatory; watch iron, zinc, iodine, calcium, omega-3"
        mandatory: [b12]
        watch: [iron, zinc, iodine, calcium, omega_3]
        citation_ids: []
        verify: false
        heuristic: false

  - id: COMBO.GLP1_T2D_STRENGTH
    goals: [glp1, t2d, strength_hybrid]
    name: "GLP-1 + T2D + strength (PRD example)"
    rd_gated: true
    resolved_energy: "Set with prescriber/RD; no automatic large deficit"
    modifiers: "Protein toward 1.6 g/kg for muscle preservation; low-GI carbs; fiber ramped gradually; insulin/sulfonylurea → hypoglycemia referral"
    protein_toward_g_per_kg: 1.6
    sequencing: "Medical constraints override; RD confirms each change"
    why: '"Your medication lowers appetite, so we focus on protein first to protect muscle."'
    text: 'GLP-1 + T2D + strength (PRD example) 🔒 | Set with prescriber/RD; no automatic large deficit | Protein toward 1.6 g/kg for muscle preservation; low-GI carbs; fiber ramped gradually; insulin/sulfonylurea → hypoglycemia referral | Medical constraints override; RD confirms each change | "Your medication lowers appetite, so we focus on protein first to protect muscle."'
    guardrail_rule_ids: [GUARD.INSULIN_SU]
    citation_ids: []
    verify: false
    heuristic: false

  - id: COMBO.LOSEFAT_HYPERTENSION
    goals: [lose_fat, hypertension]
    name: "Lose fat + hypertension"
    resolved_energy: "Per lose fat"
    modifiers: "DASH pattern ranked first; sodium cap; potassium-rich foods boosted (unless CKD/potassium-sparing meds)"
    pattern_first: PATTERN.DASH
    sequencing: "n/a"
    why: '"This eating style is the best-tested for blood pressure and fits weight loss."'
    text: 'Lose fat + hypertension | Per lose fat | DASH pattern ranked first; sodium cap; potassium-rich foods boosted (unless CKD/potassium-sparing meds) | n/a | "This eating style is the best-tested for blood pressure and fits weight loss."'
