    text: "Protein fit | Target range | Matrix A g/kg range × chosen weight basis; CKD cap overrides | Matrix A, F"
    citation_ids: [LOAM_SCORE_PAGE]
    verify: false
    heuristic: false
  - id: LS.CARB
    why: "Carbs matched to your day give you energy where you need it."
    component: carb
    score_type: range
    text: "Carb / fueling fit | Target range | Day-type g/kg (Matrix C) for training goals; otherwise the carb fill ± 10% 🧪; RD-set for T2D | Matrix C"
    fill_tolerance_pct: 10
    rd_set_goal_types: [t2d]
    citation_ids: [ACSM2016]
    verify: false
    heuristic: true
  - id: LS.FIBER
    why: "Fiber keeps you full and supports digestion."
    component: fiber
    score_type: adequacy
    text: "Fiber | Adequacy | MAX(25, 14 × E / 1000) g; GLP-1 users ramp up gradually | WHO; ADA"
    # The amount itself comes from TARGETS.FIBER via the Stage 4 targets.
    citation_ids: [WHO, ADA2026]
    verify: false
    heuristic: false
  - id: LS.MICRO
    why: "A steady supply of key vitamins and minerals across the week."
    component: micro
    score_type: adequacy
    text: 'Micronutrients | Adequacy (avg of panel) | Iron, calcium, vitamin D, magnesium, potassium, B12, folate by age + sex (Loam Score §2). Vegan: B12 flagged "must supplement". CKD: potassium credit off, RD-gated | NIH ODS'
    supplement_flags:
      [{ diet: vegan, nutrient: vitamin_b12, flag: must_supplement }]
    ckd_disables:
      [{ nutrient: potassium, disabled_id: potassium_credit, reason: rd_gated }]
    citation_ids: [NIH_ODS]
    verify: false
    heuristic: false
  - id: LS.PATTERN
    why: "A varied plate with plenty of fruit and vegetables."
    component: pattern
    score_type: pattern
    text: "Pattern + diversity | Pattern metric + small bonus | Food groups of the selected diet pattern (Matrix D); produce ≥ 400 g/day; plant-diversity bonus kept small | WHO; American Gut"
    produce_min_g_per_day: 400
    citation_ids: [WHO]
    verify: false
    heuristic: false
  - id: LS.SATFAT
    why: "Less saturated fat, with unsaturated fats in its place, is better for your heart."
    component: moderation
    score_type: moderation
    text: "Sat fat ≤ E × 0.10 / 9 g"
    energy_share: 0.10
    kcal_per_g: 9
    citation_ids: [WHO]
    verify: false
    heuristic: false
  - id: LS.FREESUGAR
    why: "Keeping added and free sugars low leaves room for more filling foods."
    component: moderation
    score_type: moderation
    text: "free sugar < E × 0.10 / 4 g"
    energy_share: 0.10
    kcal_per_g: 4
    citation_ids: [WHO]
    verify: false
    heuristic: false
  - id: LS.SODIUM
    why: "Less salt supports healthy blood pressure."
