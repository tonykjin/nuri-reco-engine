stacking:
  id: LSW.STACK.0604
  text: "Primary for scoring = the goal that holds the energy direction in the current phase (from Matrix B). weights = 0.6 × primary_row + 0.4 × mean(secondary_rows). With no secondary goals, weights = primary row. Weights are fixed per phase. Weights always sum to 100."
  primary_share: 0.6
  # Goals folded into a resolved primary don't also count as secondaries (recomp replaces
  # lose fat + build muscle, or gain weight + lose fat).
  merged_into: { recomp: [lose_fat, build_muscle, gain_weight] }
  secondary_share: 0.4
  total: 100
  citation_ids: []
  verify: false
  heuristic: true

