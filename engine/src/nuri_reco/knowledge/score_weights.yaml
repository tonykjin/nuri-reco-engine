floor_rule:
  id: LSW.FLOOR.RULE
  text: "Medical floors: a condition goal can only raise its signature components, never have them blended down. After floors are applied, the other components are scaled proportionally so the total is 100."
  citation_ids: []
  verify: false
  heuristic: true

floor_conflict:
  id: LSW.FLOOR.CONFLICT
  text: "When the medical floors alone add up to more than the total (T2D + GLP-1 + hypertension: 20 + 20 + 25 + 20 + 25 = 110), the floored components are scaled proportionally to fit and the others get no weight. These plans are RD-gated; the dietitian sets final weights."
  citation_ids: []
  verify: false
  heuristic: true

priors:
  id: LSW.PRIOR
  text: "lever = weight × shortfall_prior, top 3 shown. Shortfall priors: fiber 0.9 · pattern/produce 0.6 · protein 0.6 (0.3 if the goal row's protein weight is ≤ 10) · energy 0.5 · micronutrients 0.5 · moderation 0.5 · carb/fueling 0.4"
  priors:
    {
      fiber: 0.9,
      pattern: 0.6,
      protein: 0.6,
      energy: 0.5,
      micro: 0.5,
      moderation: 0.5,
      carb: 0.4,
    }
  low_protein_prior: 0.3
  low_protein_weight_max: 10
  top_n: 3
  citation_ids: []
  verify: false
  heuristic: true

levers:
  id: LSW.LEVERS
  text: 'Each lever comes with one sentence from a template, e.g. "Protein counts most for you: aim for about 35 g at each of 4 meals."'
  # `first` is used for the top lever, `next` for the others. Placeholders come from the
  # phase's targets (rest-day values where they vary by day type), rounded for display.
  templates:
    energy:
      first: "Hitting your energy target moves your score most: about {kcal} kcal a day."
      next: "Staying close to about {kcal} kcal a day helps your score."
    protein:
      first: "Protein counts most for you: aim for about {protein_per_meal_g} g at each of {meals} meals."
      next: "Protein helps too: about {protein_per_meal_g} g at each of {meals} meals."
    carb:
      first: "Fueling counts most for you: match your carbs to each day's training."
      next: "Match your carbs to each day's training."
    fiber:
      first: "Fiber is your biggest lever: aim for {fiber_g} g a day."
      next: "Fiber helps too: aim for {fiber_g} g a day."
    micro:
      first: "Nutrient-rich foods move your score most: vegetables, legumes, whole grains, and dairy or fortified alternatives."
      next: "Mix in nutrient-rich foods like vegetables, legumes and whole grains."
    pattern:
      first: "Variety counts most for you: aim for {produce_g} g of fruit and vegetables a day."
      next: "Aim for {produce_g} g of fruit and vegetables a day."
    moderation:
      first: "Easing off saturated fat, added sugar and salt moves your score most."
      next: "Keep saturated fat, added sugar and salt in check."
  citation_ids: []
  verify: false
  heuristic: true

component_targets:
