selection:
  - id: PATTERN.SELECT.ELIGIBLE
    step: 1
    text: "Eligible set: patterns whose best-fit goals intersect the user's resolved goals, minus anything contraindicated by Matrix F or the user's hard constraints."
    citation_ids: []
    verify: false
    heuristic: false
  - id: PATTERN.SELECT.EVIDENCE_PRIOR
    step: 2
    text: "Evidence prior: score by evidence grade and AHA tier."
    citation_ids: []
    verify: false
    heuristic: false
  - id: PATTERN.SELECT.ADHERENCE
    step: 3
    text: "Adherence score: fit to the taste profile, cuisines, dislikes, cooking time, budget, and any diet the user already follows. Weighted highest 🧪."
    weighted_highest: true
    citation_ids: []
    verify: false
    heuristic: true
  - id: PATTERN.SELECT.RANK_EXPLAIN
    step: 4
    text: 'Rank and explain: show the top pattern and one or two alternates, each with a "why". The pattern is a lens on food ranking (it boosts its food groups); it never replaces the targets.'
    alternates: { min: 1, max: 2 }
    citation_ids: []
    verify: false
    heuristic: false
