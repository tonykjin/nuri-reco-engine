    cautions: "Skip the alcohol component (pregnancy, liver, AUD); nut/fish allergens"
    adherence: "High, flexible, culturally adaptable"
    aha_tier: 1
    evidence_grade: A
    evidence: "A (PREDIMED HR ≈0.70)"
    effect: { predimed_hazard_ratio: 0.70 }
