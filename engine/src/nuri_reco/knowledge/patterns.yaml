# Matrix D: Diet-pattern catalog. Source: spec §6.
# `pattern` is the id used in PlanResponse.patterns[].id.
spec_section: "6"

evidence_grades:
  id: PATTERN.EVIDENCE_GRADES
  text: "Evidence: A = multiple RCTs/meta-analyses with strong outcomes · B = RCTs on surrogate or mixed outcomes · C = mostly observational or RCT-null. AHA tier = alignment with AHA 2021 guidance (Gardner, Circulation 2023)."
  grades:
    A: "multiple RCTs/meta-analyses with strong outcomes"
    B: "RCTs on surrogate or mixed outcomes"
    C: "mostly observational or RCT-null"
  citation_ids: [AHA2021, AHA2023]
  verify: false
  heuristic: false

