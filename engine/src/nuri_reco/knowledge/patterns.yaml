selection:
  - id: PATTERN.SELECT.ELIGIBLE
    step: 1
    text: "Eligible set: patterns whose best-fit goals intersect the user's resolved goals, minus anything contraindicated by Matrix F or the user's hard constraints."
    citation_ids: []
    verify: false
    heuristic: false
  - id: PATTERN.SELECT.EVIDENCE_PRIOR
    step: 2
    text: "Evidence prior: score by evidence grade and AHA tier."
    citation_ids: []
    verify: false
    heuristic: false
  - id: PATTERN.SELECT.ADHERENCE
    step: 3
    text: "Adherence score: fit to the taste profile, cuisines, dislikes, cooking time, budget, and any diet the user already follows. Weighted highest 🧪."
    weighted_highest: true
    citation_ids: []
    verify: false
    heuristic: true
  - id: PATTERN.SELECT.RANK_EXPLAIN
    step: 4
    text: 'Rank and explain: show the top pattern and one or two alternates, each with a "why". The pattern is a lens on food ranking (it boosts its food groups); it never replaces the targets.'
    alternates: { min: 1, max: 2 }
    citation_ids: []
    verify: false
    heuristic: false
  # --- Engine parameters for the steps above (Loam heuristics, agreed 2026-10-19). ---
  - id: PATTERN.SELECT.GOAL_MAP
    text: "Best-fit goals as goal types: Mediterranean (heart, T2D, wellness) · DASH (hypertension) · High-protein (fat loss, recomp, muscle gain, GLP-1, deadline) · Low-GI (T2D, appetite) · Energy density (fat loss, deadline, GLP-1) · Vegetarian/vegan (heart, T2D, weight, wellness) · Flexitarian/pescatarian (wellness) · Low-carb/keto (T2D, short-term loss) · IF/TRE (only when the user asks for it) · High-carb performance (endurance, hybrid)"
    goals:
      mediterranean: [hypertension, t2d, maintain]
      dash: [hypertension]
      high_protein: [lose_fat, recomp, build_muscle, glp1, deadline_event]
      low_gi: [t2d, lose_fat]
      energy_density: [lose_fat, deadline_event, glp1]
      vegetarian_vegan: [hypertension, t2d, lose_fat, maintain]
      flexitarian_pescatarian: [maintain]
      low_carb_keto: [t2d, lose_fat]
      if_tre: []
      high_carb_performance: [endurance_event, strength_hybrid]
    citation_ids: []
    verify: false
    heuristic: true
  - id: PATTERN.SELECT.DIET_FIT
    text: "Hard constraints: vegan and vegetarian users get plant-based patterns only; other diets can use any pattern. The pattern matching the diet the user already follows is always eligible."
    plant_based_diets: [vegan, vegetarian]
    plant_based_patterns: [vegetarian_vegan]
    citation_ids: []
    verify: false
    heuristic: true
  - id: PATTERN.SELECT.MATRIX_F
    text: "Matrix F exclusions: patterns safety excludes (SGLT2 inhibitor: keto / very-low-carb), and carb-restricting patterns when carb restriction needs RD approval (insulin / sulfonylurea)."
    carb_restricting_patterns: [low_carb_keto]
    citation_ids: [SGLT2_KETO_DKA_CASE]
    verify: true
    heuristic: false
  - id: PATTERN.SELECT.FIRST_LINE
    text: "First-line patterns rank above the rest for these goals: DASH for hypertension (spec 4.2: DASH pattern ranked first)."
    first_line: { hypertension: [dash] }
    citation_ids: [DASH_SODIUM]
    verify: false
    heuristic: true
  - id: PATTERN.SCORE.WEIGHTS
    text: "score = 0.35 × evidence + 0.65 × adherence (adherence weighted highest)"
    evidence: 0.35
    adherence: 0.65
    citation_ids: []
    verify: false
    heuristic: true
  - id: PATTERN.SCORE.EVIDENCE
    text: "evidence = 0.6 × grade + 0.4 × AHA tier. Grade A 1.0 · A/B 0.85 · B 0.7 · C 0.4. AHA tier 1 1.0 · 2 0.75 · 3 0.5 · 4 0.25 · n/a 0.6 (a split tier like 3 / 4 averages)."
    grade_share: 0.6
    tier_share: 0.4
    grade: { A: 1.0, A/B: 0.85, B: 0.7, C: 0.4 }
    tier: { 1: 1.0, 2: 0.75, 3: 0.5, 4: 0.25 }
    tier_unrated: 0.6
    citation_ids: [AHA2023]
    verify: false
    heuristic: true
  - id: PATTERN.SCORE.ADHERENCE
    text: "adherence = Matrix D baseline (High 0.8 · least restrictive 0.85 · High if protein foods are liked 0.7 · Moderate or needs periodization 0.6 · strong if values-driven 0.6 · falls off 0.5 · polarizing 0.4) + cuisine match 0.15 + already follows this diet 0.2 + asked for this pattern 0.5 + taste match 0.05 per dimension (max 0.1, dimension at 0.6 or more) − low budget on a costly pattern 0.15 − quick cooking (15 min or less) on a cook-heavy pattern 0.1 − 0.1 per disliked signature food (max 0.2); never below 0"
    baseline:
      mediterranean: 0.8
      dash: 0.6
      high_protein: 0.7
      low_gi: 0.8
      energy_density: 0.8
      vegetarian_vegan: 0.6
      flexitarian_pescatarian: 0.85
      low_carb_keto: 0.5
      if_tre: 0.4
      high_carb_performance: 0.6
      mind: 0.8
    cuisine_match: 0.15
    diet_match: 0.2
    pattern_pref: 0.5
    taste_match: 0.05
    taste_match_max: 0.1
    taste_threshold: 0.6
    budget_penalty: 0.15
    quick_cook_minutes: 15
    cook_time_penalty: 0.1
    dislike_penalty: 0.1
    dislike_penalty_max: 0.2
    follows:
      vegetarian_vegan: [vegan, vegetarian]
      flexitarian_pescatarian: [pescatarian, flexitarian]
    cuisines:
      mediterranean: [mediterranean, greek, italian, spanish, middle_eastern]
      dash: [american]
      vegetarian_vegan: [indian, middle_eastern, ethiopian]
      flexitarian_pescatarian: [japanese, nordic, mediterranean]
      high_carb_performance: [italian, japanese]
    signature_foods:
      mediterranean: [fish, olive oil, nuts, legumes, whole grains]
      dash: [low-fat dairy, vegetables, fruit, whole grains, nuts]
      high_protein: [chicken, fish, eggs, greek yogurt, cottage cheese, tofu]
      low_gi: [legumes, oats, barley, whole grains]
      energy_density: [vegetables, soups, fruit, salads]
      vegetarian_vegan: [tofu, legumes, nuts, tempeh]
      flexitarian_pescatarian: [fish, seafood, legumes]
      low_carb_keto: [meat, eggs, cheese, avocado]
      high_carb_performance: [rice, pasta, bread, potatoes]
    costly: [high_protein]
    cook_heavy: [mediterranean, dash]
    taste_tags:
      mediterranean: [richness, umami]
      flexitarian_pescatarian: [umami]
      low_carb_keto: [richness]
      high_carb_performance: [sweetness]
    citation_ids: []
