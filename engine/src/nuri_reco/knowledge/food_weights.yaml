    copy:
      protein: "{value:.0f} g protein per 100 kcal"
      fiber: "{value:.1f} g fiber per 100 kcal"
      low_energy_density: "low energy density"
      low_gi: "low GI"
      nutrient_rich: "nutrient-rich"
