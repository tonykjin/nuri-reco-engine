ranking_pipeline:
  - id: FOOD.RANK.HARD_FILTERS
    step: 1
    text: "Hard filters: allergens, medical, religious/ethical (§9)"
    citation_ids: []
    verify: false
    heuristic: false
  - id: FOOD.RANK.PATTERN_LENS
    step: 2
    text: "Pattern lens: boost food groups of the selected pattern"
    citation_ids: []
    verify: false
    heuristic: false
  - id: FOOD.RANK.GOAL_SCORE
    step: 3
    text: "Goal score: weighted attributes for the current phase and day type"
    citation_ids: []
    verify: false
    heuristic: false
  - id: FOOD.RANK.TASTE_RERANK
    step: 4
    text: "Taste re-rank: taste-profile fit; dislikes down-weighted (neutral until the taste profile has enough scans, PRD §7.3)"
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: false
  - id: FOOD.RANK.CONTEXT_BOOSTS
    step: 5
    text: 'Context boosts: Virtual Pantry items, NIR "peaks tonight", gaps in today''s targets, weekly HEI/micronutrient gaps'
    citation_ids: []
    verify: false
    heuristic: false
  - id: FOOD.RANK.DIVERSITY
    step: 6
    text: "Diversity: avoid repeating the same item; small novelty slot"
    citation_ids: []
    verify: false
    heuristic: false
  - id: FOOD.RANK.EXPLAIN
    step: 7
    text: 'Explain: e.g. "21 g protein per 100 kcal · low energy density · in your pantry, peaks tonight"'
    citation_ids: []
    verify: false
    heuristic: false

ranking_note:
  id: FOOD.RANK.HEALTH_FIRST
  text: "Pure collaborative filtering drifts toward unhealthy items (Trattner & Elsweiler: only 6 of 5,237 popular online recipes met WHO guidelines). Health must be an explicit objective, which is why taste is a re-rank inside a health-scored set and never the primary sort."
  recipes_meeting_who: 6
  recipes_sampled: 5237
  citation_ids: [TRATTNER_ELSWEILER2017]
  verify: false
  heuristic: false
