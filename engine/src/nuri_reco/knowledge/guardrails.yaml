# Matrix F: Guardrails & referrals (Tier 1, always evaluated first). Source: spec §8.
# Rows tagged "⚠️ verify" or "⚠️ clinical sign-off" are verify: true (the page's legend says ⚠️
# items need clinical sign-off before they ship). "🧪 bands" is heuristic: true.
#
# safety.py reads these rules. `copy` is the user-facing wording (plain language, no numbers):
#   block    - shown when the rule blocks something the user asked for (a deficit, a weight-loss target)
#   referral - shown whenever the rule's trigger fires
#   warning  - shown whenever the rule's trigger fires
#   why      - the reason, attached to every finding from the rule
spec_section: "8"

guardrails:
  - id: GUARD.CALORIE_FLOOR
    rule: "Calorie floor"
    trigger: "Always"
    action: "kcal ≥ max(sex floor: 1,200 women / 1,500 men; EA floor 30 kcal/kg FFM + exercise kcal for active users). Below 800 kcal/day never (medical supervision only)"
    source: "AHA/ACC/TOS 2013; IOC REDs"
    text: "Calorie floor | Always | kcal ≥ max(sex floor: 1,200 women / 1,500 men; EA floor 30 kcal/kg FFM + exercise kcal for active users). Below 800 kcal/day never (medical supervision only) | AHA/ACC/TOS 2013; IOC REDs"
    applies: always
    sex_floor_kcal: { female: 1200, male: 1500 }
    ea_floor_kcal_per_kg_ffm: 30
    ea_floor_adds_exercise_kcal: true
    absolute_min_kcal_per_day: 800
    citation_ids: [AHA_ACC_TOS2013, IOC_REDS2023]
    verify: false
    heuristic: false

  - id: GUARD.MAX_LOSS_RATE
    rule: "Max loss rate"
    trigger: "Deficit goals"
    action: "BMI ≥30: 1.0% · 25–30: 0.75% · under 25 or lean athlete: 0.5% BW/week 🧪 bands"
    source: "Helms 2014; Garthe 2011"
    text: "Max loss rate | Deficit goals | BMI ≥30: 1.0% · 25–30: 0.75% · under 25 or lean athlete: 0.5% BW/week 🧪 bands | Helms 2014; Garthe 2011"
    applies: deficit_goals
    # bmi_min inclusive, bmi_below exclusive.
    bands:
      - { bmi_min: 30, max_loss_pct_bw_per_week: 1.0 }
      - { bmi_min: 25, bmi_below: 30, max_loss_pct_bw_per_week: 0.75 }
      - { bmi_below: 25, max_loss_pct_bw_per_week: 0.5 }
    lean_athlete_max_loss_pct_bw_per_week: 0.5
    citation_ids: [HELMS2014, GARTHE2011]
    verify: false
    heuristic: true

  - id: GUARD.UNDER_18
    rule: "Under 18"
    trigger: "Age"
    action: "Block deficits; maintenance + family/clinician referral"
    source: "AAP 2023"
    text: "Under 18 | Age | Block deficits; maintenance + family/clinician referral | AAP 2023"
    age_below: 18
    blocks: [deficit]
    fallback_energy: maintenance
    referral_to: [family, clinician]
    copy:
      block: "We don't set weight-loss plans for children or teens."
      referral: "A parent, guardian or your doctor can help you plan meals that support growing."
      why: "Growing bodies need enough energy, so weight loss needs a clinician involved."
    citation_ids: [AAP2023]
    verify: false
    heuristic: false

  - id: GUARD.PREGNANCY
    rule: "Pregnancy / breastfeeding"
    trigger: "Flag"
    action: "Block deficits and weight-loss targets; RD referral ⚠️ verify (IOM 2009 / ACOG)"
    source: "n/a"
    text: "Pregnancy / breastfeeding | Flag | Block deficits and weight-loss targets; RD referral ⚠️ verify (IOM 2009 / ACOG) | n/a"
    flags: [pregnant, breastfeeding]
    blocks: [deficit, weight_loss_targets]
    referral_to: [rd]
    copy:
      block: "We don't set calorie deficits or weight-loss targets during pregnancy or breastfeeding."
      referral: "A registered dietitian can build a plan that fits this stage."
      why: "Energy needs go up during pregnancy and breastfeeding, so cutting calories isn't recommended."
    citation_ids: [IOM2009, ACOG]
    verify: true
    heuristic: false

  - id: GUARD.ED_RISK
    rule: "Eating-disorder risk"
    trigger: "SCOFF ≥2, ED history, goal BMI under 18.5, repeated rapid-loss requests"
    action: "Block deficit and aesthetic modes; offer number-hiding mode; referral resources"
    source: "Morgan 1999 (SCOFF); PRD §4.7"
    text: "Eating-disorder risk | SCOFF ≥2, ED history, goal BMI under 18.5, repeated rapid-loss requests | Block deficit and aesthetic modes; offer number-hiding mode; referral resources | Morgan 1999 (SCOFF); PRD §4.7"
    triggers:
      scoff_min: 2
      ed_history: true
      goal_bmi_below: 18.5
      repeated_rapid_loss_requests: true
    blocks: [deficit, aesthetic_modes]
    offer: [number_hiding_mode]
    referral_to: [resources]
    copy:
      block: "We won't set a calorie deficit or a goal-date plan right now."
      referral: "Support is available. A doctor or an eating-disorder helpline can help."
      why: "Some of your answers suggest dieting could be harmful right now, and your wellbeing comes first."
    citation_ids: [SCOFF1999, NURI_PRD]
    verify: false
    heuristic: false

  - id: GUARD.LOW_EA
    rule: "Low energy availability"
    trigger: "EA under 30 kcal/kg FFM, or user reports missed periods, stress fractures, persistent fatigue"
    action: "Remove deficit; refer to doctor or sports RD"
    source: "IOC REDs 2023 ⚠️ verify EA wording"
    text: "Low energy availability | EA under 30 kcal/kg FFM, or user reports missed periods, stress fractures, persistent fatigue | Remove deficit; refer to doctor or sports RD | IOC REDs 2023 ⚠️ verify EA wording"
    triggers:
      ea_below_kcal_per_kg_ffm: 30
      reported_symptoms: [missed_periods, stress_fractures, persistent_fatigue]
    # "Remove deficit": the plan continues at maintenance instead of being blocked.
    removes: [deficit]
    referral_to: [doctor, sports_rd]
    copy:
      warning: "We've taken the calorie deficit out of your plan."
      referral: "Please check in with a doctor or a sports dietitian."
      why: "Missed periods, stress fractures or ongoing tiredness can mean you're not eating enough for your training."
    citation_ids: [IOC_REDS2023]
    verify: true
    heuristic: false

  - id: GUARD.CKD
    rule: "CKD"
    trigger: "Flag (stage)"
    action: "Protein cap overrides goals: 0.55–0.6 g/kg (stage 3–5, no diabetes) or 0.6–0.8 g/kg (with diabetes); DASH potassium caution; RD-gated"
    source: "KDOQI 2020"
    text: "CKD | Flag (stage) | Protein cap overrides goals: 0.55–0.6 g/kg (stage 3–5, no diabetes) or 0.6–0.8 g/kg (with diabetes); DASH potassium caution; RD-gated | KDOQI 2020"
    protein_cap_overrides_goals: true
    # The stage range applies to both caps (KDOQI 2020 restriction is for stage 3-5); stages 1-2
    # get the RD gate and potassium caution only.
    protein_cap_g_per_kg:
      stages: { min: 3, max: 5 }
      no_diabetes: { min: 0.55, max: 0.6 }
      with_diabetes: { min: 0.6, max: 0.8 }
    cautions: [dash_potassium]
    rd_gated: true
    copy:
      warning: "Your protein target is capped and potassium-rich suggestions are limited to protect your kidneys."
      why: "Kidney disease changes how much protein and potassium is right for you, so a dietitian reviews your plan."
    citation_ids: [KDOQI2020]
    verify: false
    heuristic: false

  - id: GUARD.SGLT2
    rule: "SGLT2 inhibitor"
    trigger: "Medication"
    action: "Exclude keto / very-low-carb patterns"
    source: "Case literature ⚠️ clinical sign-off"
    text: "SGLT2 inhibitor | Medication | Exclude keto / very-low-carb patterns | Case literature ⚠️ clinical sign-off"
    medications: [sglt2_inhibitor]
    exclude_pattern_ids: [PATTERN.LOW_CARB_KETO]
    copy:
      warning: "Keto and very-low-carb eating patterns are left out of your options."
      why: "With your medication, very-low-carb eating can raise the risk of a serious side effect."
    citation_ids: [SGLT2_KETO_DKA_CASE]
    verify: true
    heuristic: false

  - id: GUARD.INSULIN_SU
    rule: "Insulin / sulfonylurea"
    trigger: "Medication"
    action: "No carb restriction or large deficit without RD; hypoglycemia notice"
    source: "⚠️ clinical sign-off"
    text: "Insulin / sulfonylurea | Medication | No carb restriction or large deficit without RD; hypoglycemia notice | ⚠️ clinical sign-off"
    medications: [insulin, sulfonylurea]
    blocks_without_rd: [carb_restriction, large_deficit]
    notice: hypoglycemia
    referral_to: [rd]
    copy:
      warning: "Watch for signs of low blood sugar if you change how much or when you eat."
      referral: "A dietitian should sign off on any carb cuts or large calorie deficits."
      why: "Your medication lowers blood sugar, so big changes in carbs or calories can push it too low."
    citation_ids: []
    verify: true
    heuristic: false

  - id: GUARD.WARFARIN
    rule: "Warfarin"
    trigger: "Medication"
    action: "Keep vitamin K intake consistent; don't suddenly boost leafy greens"
    source: "⚠️ clinical sign-off"
    text: "Warfarin | Medication | Keep vitamin K intake consistent; don't suddenly boost leafy greens | ⚠️ clinical sign-off"
    medications: [warfarin]
    keep_consistent: [vitamin_k]
    copy:
      warning: "Keep leafy greens and other vitamin K foods steady from day to day."
      why: "Your medication works best when your vitamin K intake stays consistent."
    citation_ids: []
    verify: true
    heuristic: false

  - id: GUARD.CONDITION_GOALS
    rule: "Condition goals (T2D, GLP-1, CKD, hypertension on meds)"
    trigger: "Goal type"
    action: 'RD-gated on Care; app-only users get general-wellness guidance + "talk to your clinician"'
    source: "PRD §8.1, §5.8"
    text: 'Condition goals (T2D, GLP-1, CKD, hypertension on meds) | Goal type | RD-gated on Care; app-only users get general-wellness guidance + "talk to your clinician" | PRD §8.1, §5.8'
    # How each condition is detected. A condition matches on any listed goal type, flags.conditions
    # entry, medication or a set ckd_stage; `with_medications` must also be present when given.
    conditions:
      t2d: { goal_types: [t2d], conditions: [t2d] }
      glp1: { goal_types: [glp1], medications: [glp1_agonist] }
      ckd: { ckd_stage: true }
      hypertension_on_meds:
        goal_types: [hypertension]
        conditions: [hypertension]
        with_medications: [antihypertensive]
    rd_gated_on: care
    app_only_fallback: general_wellness
    copy:
      warning: "A dietitian will confirm your plan. Until then, talk to your clinician before making big changes."
      why: "Goals tied to a health condition are reviewed by a dietitian."
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: false

  - id: GUARD.CLAIMS
    rule: "Claims guardrail"
    trigger: "All copy"
    action: 'No diagnosis, no "treats" or "cures", no food-safety guarantees; all outputs labelled Recommended'
    source: "PRD §4, §11"
    text: 'Claims guardrail | All copy | No diagnosis, no "treats" or "cures", no food-safety guarantees; all outputs labelled Recommended | PRD §4, §11'
    forbidden: [diagnosis, treats, cures, food_safety_guarantees]
    # Matched case-insensitively as whole words/phrases by safety.claims_violations().
    forbidden_phrases:
      [
        diagnose,
        diagnosis,
        diagnosed,
        treat,
        treats,
        cure,
        cures,
        "safe to eat",
      ]
    provenance_label: recommended
    citation_ids: [NURI_PRD]
    verify: false
    heuristic: false

  - id: GUARD.PEAK_WEEK
    rule: "Peak-week safety"
    trigger: "Deadline events"
    action: "Never water restriction, diuretics or extreme sodium manipulation"
    source: "Helms 2014"
    text: "Peak-week safety | Deadline events | Never water restriction, diuretics or extreme sodium manipulation | Helms 2014"
    never: [water_restriction, diuretics, extreme_sodium_manipulation]
    citation_ids: [HELMS2014]
    verify: false
    heuristic: false
