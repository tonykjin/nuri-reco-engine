# Matrix A: Goal catalog (single goals). Source: spec §3.
# Every rule has id, citation_ids, verify (⚠️ verify on the page) and heuristic (🧪 Loam heuristic).
# `text` is the page cell verbatim (markdown emphasis removed); structured fields carry its numbers.
# Units: *_g_per_kg = g per kg body weight; *_g_per_kg_ffm = per kg fat-free mass;
# *_pct = percent as written on the page (0.5 means 0.5%).
spec_section: "3"

method:
  id: GOAL.METHOD
  text: "W = body weight (kg) · FFM = fat-free mass · TDEE from Mifflin-St Jeor × activity factor until adaptive expenditure takes over (week 3–4, PRD §7.1). Protein is set first in g/kg, fat next, carbs fill the remainder."
  tdee_equation: mifflin_st_jeor
  adaptive_expenditure_from_week: { min: 3, max: 4 }
  macro_order: [protein, fat, carbs]
  citation_ids: [NURI_PRD]
  verify: false
  heuristic: false

goals:
  - id: GOAL.LOSE_FAT
    type: lose_fat
    name: "Lose fat"
    rd_gated: false
    citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
    verify: false
    heuristic: false
    rules:
      energy:
        id: GOAL.LOSE_FAT.ENERGY
        text: "Deficit 500–750 kcal/day or 15–25% of TDEE; never below floors (Matrix F)"
        direction: deficit
        deficit_kcal_per_day: { min: 500, max: 750 }
        deficit_pct_tdee: { min: 15, max: 25 }
        floor_rule_ids: [GUARD.CALORIE_FLOOR]
        citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
        verify: false
        heuristic: false
      protein:
        id: GOAL.LOSE_FAT.PROTEIN
        text: "1.2–1.6 g/kg (no lifting); 1.6–2.2 g/kg with resistance training; lean + training: 2.3–3.1 g/kg FFM"
        no_resistance_g_per_kg: { min: 1.2, max: 1.6 }
        resistance_g_per_kg: { min: 1.6, max: 2.2 }
        lean_resistance_g_per_kg_ffm: { min: 2.3, max: 3.1 }
        citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
        verify: false
        heuristic: false
      carbs_fat:
        id: GOAL.LOSE_FAT.CARBS_FAT
        text: "Fat 20–35% (min 0.5 g/kg); carbs fill"
        fat_pct_kcal: { min: 20, max: 35 }
        fat_min_g_per_kg: 0.5
        carbs: fill
        citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
        verify: false
        heuristic: false
      rate:
        id: GOAL.LOSE_FAT.RATE
        text: "0.5–1.0% BW/week by BMI band"
        loss_pct_bw_per_week: { min: 0.5, max: 1.0 }
        band_rule_ids: [GUARD.MAX_LOSS_RATE]
        citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
        verify: false
        heuristic: false
      food_priorities:
        id: GOAL.LOSE_FAT.FOODS
        text: "Low energy density, high protein/100 kcal, high fiber, minimally processed"
        citation_ids: [AHA_ACC_TOS2013, ISSN2017, HELMS2014]
        verify: false
        heuristic: false

