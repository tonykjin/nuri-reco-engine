# Every sentence the engine shows, keyed by rule id (spec §10: every output carries a why).
# Variants: `rule` explains the rule itself (dev drawer, tooltips; required for every rule id the
# engine outputs); other variants are the copy a stage uses (why, block, referral, warning, headline,
# lever and chip sentences). {placeholders} are filled by the engine. explain.py runs every rendered
# string through the claims filter (GUARD.CLAIMS, PRD §4 and §11).
