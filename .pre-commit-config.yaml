repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        # kb_broken/ holds deliberately invalid YAML for the loader tests; foods.json is generated
        # by data/build_foods.py and must stay byte-identical to its output.
        exclude: ^(CLAUDE\.md|.*package-lock\.json|engine/tests/fixtures/kb_broken/.*|engine/data/foods\.json)$
